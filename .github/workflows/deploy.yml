name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro SSG
        run: npm run build
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY || 'AIzaSyDqpHnIWyPAA1rlGimPHBeaW4SIZfUX9-w' }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN || 'xuanlocchs.firebaseapp.com' }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID || 'xuanlocchs' }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET || 'xuanlocchs.firebasestorage.app' }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '173381053400' }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID || '1:173381053400:web:1f59ec02ad7ad05ea620ad' }}

      - name: Deploy to Firebase Hosting & Firestore Rules
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::Using FIREBASE_SERVICE_ACCOUNT (length: ${#FIREBASE_SERVICE_ACCOUNT})"
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
            CMD="npx -y firebase-tools deploy --only hosting,firestore:rules --project xuanlocchs --non-interactive"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "::notice::Using FIREBASE_TOKEN (length: ${#FIREBASE_TOKEN})"
            CMD="npx -y firebase-tools deploy --only hosting,firestore:rules --project xuanlocchs --token $FIREBASE_TOKEN --non-interactive"
          else
            echo "::error::Khong tim thay FIREBASE_SERVICE_ACCOUNT hoac FIREBASE_TOKEN trong GitHub Secrets"
            exit 1
          fi

          echo "Running: $CMD"
          if ! eval "$CMD" > /tmp/deploy.log 2>&1; then
            cat /tmp/deploy.log
            ERR=$(tail -n 20 /tmp/deploy.log | tr '\r\n' ' ')
            echo "::error title=FirebaseDeployError::$ERR"
            echo "### Firebase Deploy Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/deploy.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHSXUANLOC }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}





