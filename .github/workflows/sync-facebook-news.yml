name: Tự động đồng bộ tin tức Fanpage THPT Xuân Lộc

on:
  schedule:
    # Chạy định kỳ vào 06:00 sáng và 18:00 chiều mỗi ngày (UTC: 23:00 và 11:00)
    - cron: '0 23,11 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub bất cứ lúc nào

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Chạy AI Quét & Biên tập tin tức Fanpage
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node src/services/syncFacebookCron.js

      - name: Tự động Commit & Push bài báo mới lên website
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto(news): sync new articles from THPT Xuan Loc Facebook fanpage"
          branch: main
