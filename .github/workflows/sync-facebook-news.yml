name: Tự động đồng bộ tin tức Fanpage & Cổng TTĐT Xuân Lộc

on:
  schedule:
    # Chạy định kỳ vào 06:00 sáng và 18:00 chiều mỗi ngày (UTC: 23:00 và 11:00)
    - cron: '0 23,11 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub bất cứ lúc nào

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Chạy AI Quét & Biên tập tin tức Fanpage THPT Xuân Lộc
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node src/services/syncFacebookCron.js

      - name: Chạy AI Quét & Đồng bộ tin tức Cổng TTĐT Xuân Lộc (Văn hóa - Xã hội)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node -e "import('./src/services/portalNewsAiPipeline.js').then(m => m.syncPortalNews())"

      - name: Tự động Commit & Push bài báo mới lên Git
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto(news): sync new articles from Facebook fanpage & Xuan Loc portal"
          branch: main

      - name: Build & Xuất bản trực tiếp lên Firebase Hosting
        if: steps.auto_commit.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}

      - name: Deploy Live lên Firebase Hosting
        if: steps.auto_commit.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHSXUANLOC }}'
          channelId: live
          projectId: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}

