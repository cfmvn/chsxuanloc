name: Quét & Đồng Bộ Tin Tức (Fanpage & Cổng TTĐT)

on:
  schedule:
    # Chạy định kỳ 2 lần mỗi ngày (06:00 và 18:00 giờ VN - UTC 23:00 và 11:00)
    - cron: '0 23,11 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ Admin / GitHub Actions

jobs:
  sync-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Chạy AI Quét & Biên tập tin tức Fanpage THPT Xuân Lộc
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node src/services/syncFacebookCron.js

      - name: Chạy AI Quét & Đồng bộ tin tức Cổng TTĐT Xuân Lộc
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node -e "import('./src/services/portalNewsAiPipeline.js').then(m => m.syncPortalNews())"

      - name: Tự động Commit & Push bài báo mới lên Git
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto(news): dong bo tin tuc moi tu Fanpage & Cong TTDT Xuan Loc"
          branch: main

      - name: Build & Xuất bản lên Firebase Hosting
        if: steps.auto_commit.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY || 'AIzaSyDqpHnIWyPAA1rlGimPHBeaW4SIZfUX9-w' }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN || 'xuanlocchs.firebaseapp.com' }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID || 'xuanlocchs' }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET || 'xuanlocchs.firebasestorage.app' }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '173381053400' }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID || '1:173381053400:web:1f59ec02ad7ad05ea620ad' }}

      - name: Deploy Live lên Firebase Hosting
        if: steps.auto_commit.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
            npx -y firebase-tools deploy --only hosting --project xuanlocchs --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            npx -y firebase-tools deploy --only hosting --project xuanlocchs --token "$FIREBASE_TOKEN" --non-interactive
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHSXUANLOC }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
