name: AI Sáng Tác Góc Tâm Tình & Hoài Niệm CHS (Lưu Firestore)

on:
  schedule:
    # Chạy tự động vào 07:00 sáng mỗi ngày (giờ VN - UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ Admin / GitHub Actions

jobs:
  generate-tam-su:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Chạy AI Tự động sáng tác bài & Lưu trực tiếp vào Firebase Firestore
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY || 'AIzaSyDqpHnIWyPAA1rlGimPHBeaW4SIZfUX9-w' }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID || 'xuanlocchs' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/services/autoDailyTamSu.js

